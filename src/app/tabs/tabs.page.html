<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/home">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="activity" href="/activity">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>Activity</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="budgets" href="/budgets">
      <ion-icon aria-hidden="true" name="wallet-outline"></ion-icon>
      <ion-label>Budgets</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="insights" href="/insights">
      <ion-icon aria-hidden="true" name="pie-chart-outline"></ion-icon>
      <ion-label>Insights</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<ion-fab class="dock-fab">
  <ion-fab-button routerLink="/add-expense" aria-label="Add expense">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
