<ion-header class="tally-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>New expense</ion-title>
    <ion-note slot="end" class="header-note mono">DRAFT</ion-note>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-pad add-pad">
    <!-- Amount -->
    <ion-card class="tally-card amount-card">
      <ion-card-content>
        <span class="eyebrow">Amount</span>

        <div class="amount-line">
          <span class="peso mono">₱</span>
          <ion-input
            class="amount-input mono"
            inputmode="decimal"
            placeholder="0.00"
            value="285.00"
            aria-label="Expense amount"
          ></ion-input>
        </div>

        <hr class="dashed-rule" />
        <span class="amount-hint mono">PHP · TAP THE NUMBER TO EDIT</span>
      </ion-card-content>
    </ion-card>

    <!-- Category -->
    <div class="field-block">
      <span class="field-label mono">Category</span>
      <div class="chip-grid">
        <ion-chip class="stamp-chip cat-food selected">Food</ion-chip>
        <ion-chip class="stamp-chip cat-transport">Transport</ion-chip>
        <ion-chip class="stamp-chip cat-bills">Bills</ion-chip>
        <ion-chip class="stamp-chip cat-fun">Fun</ion-chip>
        <ion-chip class="stamp-chip cat-health">Health</ion-chip>
        <ion-chip class="stamp-chip cat-shopping">Shopping</ion-chip>
      </div>
    </div>

    <!-- Note -->
    <div class="field-block">
      <span class="field-label mono">Note</span>
      <ion-input
        class="tally-field mono"
        placeholder="What was this for?"
        value="Lunch at Jollibee"
        aria-label="Note"
      ></ion-input>
    </div>

    <!-- Date -->
    <div class="field-block">
      <span class="field-label mono">Date</span>
      <div class="date-box tally-card">
        <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
        <ion-datetime-button datetime="expense-date"></ion-datetime-button>
      </div>

      <!-- Ionic 9 no longer has a compact datetime, so the picker opens in a modal. -->
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="expense-date" presentation="date" [value]="today"></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>

    <!-- Receipt scan (visual only) -->
    <ion-button expand="block" fill="outline" class="scan-btn">
      <ion-icon slot="start" name="camera-outline"></ion-icon>
      Scan receipt
    </ion-button>

    <ion-button expand="block" class="save-btn" routerLink="/home">Save expense</ion-button>

    <p class="save-note mono">Saved to the November ledger · not a real transaction</p>
  </div>
</ion-content>
