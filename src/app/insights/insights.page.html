<ion-header class="tally-header">
  <ion-toolbar>
    <ion-title>Insights</ion-title>
    <ion-note slot="end" class="header-note mono">NOV 2026</ion-note>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-segment value="month" class="tally-segment">
    <ion-segment-button value="week">
      <ion-label>Week</ion-label>
    </ion-segment-button>
    <ion-segment-button value="month">
      <ion-label>Month</ion-label>
    </ion-segment-button>
    <ion-segment-button value="year">
      <ion-label>Year</ion-label>
    </ion-segment-button>
  </ion-segment>

  <div class="page-pad dock-clear">
    <!-- CSS-only pie chart -->
    <ion-card class="tally-card pie-card">
      <ion-card-content>
        <div class="pie-wrap">
          <div class="pie" role="img" aria-label="Spending by category for November"></div>
          <div class="pie-hole">
            <span class="eyebrow">Total spent</span>
            <span class="pie-total mono">₱11,550</span>
            <span class="pie-range mono">NOV 1–15</span>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <div class="section-head">
      <h2 class="section-title">Where it went</h2>
      <span class="mono section-note">6 ENVELOPES</span>
    </div>

    <ion-card class="tally-card legend-card">
      <ion-list lines="none" class="receipt-list legend-list">
        @for (row of legend; track row.name) {
        <ion-item class="legend-item">
          <span slot="start" [class]="'legend-dot ' + row.categoryClass" aria-hidden="true"></span>
          <ion-label>
            <h2 class="legend-name">{{ row.name }}</h2>
          </ion-label>
          <div slot="end" class="legend-end">
            <span class="legend-amount mono">{{ row.amount }}</span>
            <ion-note class="mono legend-pct">{{ row.percent }}</ion-note>
          </div>
        </ion-item>
        }
      </ion-list>
    </ion-card>

    <div class="section-head">
      <h2 class="section-title">Worth noting</h2>
      <span class="mono section-note">PEAK DAY</span>
    </div>

    <ion-card class="tally-card peak-card">
      <ion-card-content>
        <div class="peak-top">
          <span class="eyebrow">Top spending day</span>
          <ion-chip class="stamp-chip cat-shopping">Saturday</ion-chip>
        </div>

        <div class="peak-row">
          <span class="peak-date">NOV 14</span>
          <span class="peak-amount mono highlight">₱1,845.50</span>
        </div>

        <hr class="dashed-rule" />

        <p class="peak-note mono">SM Supermarket · weekly grocery run · 4 items</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
